name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy files to VPS (Auto create folder)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.USERNAME }}/ytdownloader"
          strip_components: 0

      - name: Install & Restart Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Masuk ke folder yang baru saja dibuat & dicopy oleh langkah sebelumnya
            cd /home/${{ secrets.USERNAME }}/ytdownloader
            
            # Bersihkan file Node.js yang sudah tidak terpakai
            rm -rf server.js package.json package-lock.json node_modules
            
            # Hapus proses PM2 lama (karena sebelumnya menunjuk ke server.js)
            pm2 delete ytdownloader || true
            
            # Setup Python environment dan install requirements
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Start aplikasi baru menggunakan PM2 dengan Python
            pm2 start "venv/bin/python main.py" --name "ytdownloader"
            pm2 save
